# The website, https://v1k70rk4.github.io/RemoteAppClient/: MkDocs with the Material theme builds it from the
# markdown files under docs/ (.github/workflows/docs.yml deploys it). To build it on your PC:
#   python -m venv .venv ; .venv\Scripts\pip install -r website\requirements.txt ; .venv\Scripts\mkdocs serve
site_name: RemoteAppClient
site_url: https://v1k70rk4.github.io/RemoteAppClient/
site_description: Self-hosted remote access and fleet management for Windows devices, built on .NET 10 - a SYSTEM agent, a Linux server, operator consoles, signed commands and reverse SSH tunnels to TightVNC.
site_author: v1k70rk4
repo_url: https://github.com/v1k70rk4/RemoteAppClient
repo_name: v1k70rk4/RemoteAppClient
edit_uri: edit/master/docs/
copyright: MIT licensed · TightVNC is a separate program under its own GPLv2 licence.

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  custom_dir: website/overrides
  language: en
  logo: images/icon.png
  favicon: images/icon.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/v1k70rk4/RemoteAppClient
      name: RemoteAppClient on GitHub
    - icon: material/download
      link: https://github.com/v1k70rk4/RemoteAppClient/releases/latest
      name: Latest release
    - icon: simple/kofi
      link: https://ko-fi.com/v1k70rk4
      name: Ko-fi

hooks:
  - website/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Get started:
      - getting-started/index.md
      - The server: getting-started/server.md
      - The first device: getting-started/first-device.md
      - The consoles: getting-started/consoles.md
  - Features:
      - features/index.md
      - Remote access: features/remote-access.md
      - Fleet management: features/fleet.md
      - Updates and packages: features/updates.md
      - Diagnostics: features/diagnostics.md
  - Security:
      - security/index.md
      - Keys and certificates: security/keys.md
  - Reference:
      - reference/index.md
      - Architecture: reference/architecture.md
      - Configuration: reference/configuration.md
      - Commands: reference/commands.md
  - Changelog: changelog.md
  - Development: development.md
  - About: about.md
